  "tools/projects-agent-mcp/test_tracking.py",
  "tools/projects-agent-mcp/test_tracking_io.py",
  "tools/projects-agent-mcp/test_worker_model.py",
  "tools/projects-agent-mcp/tracking.py",
  "tools/projects-agent-mcp/tracking_cli.py",
  "tools/projects-agent-mcp/tracking_io.py",
  "tools/projects-agent-mcp/verify_management_policies.py",
  "tools/projects-agent-mcp/worker-model.toml",
  "uv.lock"
]
