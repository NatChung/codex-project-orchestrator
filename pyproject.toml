[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-project-orchestrator"
version = "0.1.0"
description = "Coordinate independent Codex project workers with explicit permission profiles and durable mail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "NatChung"}]
dependencies = ["fastmcp>=2.14,<3", "websockets>=15,<17", "filelock>=3.20,<4"]

[project.scripts]
cpo = "codex_project_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_project_orchestrator"]

# Build only versioned shared files; never walk sibling project repositories.
[tool.hatch.build.targets.sdist]
only-include = [
  ".github/workflows/tests.yml",
  ".gitignore",
  "AGENTS.md",
  "LICENSE",
  "README.md",
  "docs/architecture.md",
  "docs/demo.md",
  "docs/security.md",
  "docs/verification.md",
  "docs/workspace-versioning.md",
  "pyproject.toml",
  "scripts/project_mode.py",
  "scripts/setup_orch.py",
  "scripts/test_project_mode.py",
  "scripts/test_setup_orch.py",
  "src/codex_project_orchestrator/__init__.py",
  "src/codex_project_orchestrator/__main__.py",
  "src/codex_project_orchestrator/cli.py",
  "src/codex_project_orchestrator/config.py",
  "src/codex_project_orchestrator/doctor.py",
  "src/codex_project_orchestrator/mailbox.py",
  "src/codex_project_orchestrator/mcp.py",
  "src/codex_project_orchestrator/orchestrator.py",
  "src/codex_project_orchestrator/runtime.py",
  "src/codex_project_orchestrator/services.py",
  "src/codex_project_orchestrator/worktrees.py",
  "tests/test_cli.py",
  "tests/test_config.py",
  "tests/test_doctor.py",
  "tests/test_mailbox.py",
  "tests/test_mcp.py",
  "tests/test_orchestrator.py",
  "tests/test_runtime.py",
  "tests/test_worktrees.py",
  "tools/projects-agent-mcp/README.md",
  "tools/projects-agent-mcp/install_management.py",
  "tools/projects-agent-mcp/lifecycle.py",
  "tools/projects-agent-mcp/operator.example.toml",
  "tools/projects-agent-mcp/operator_settings.py",
