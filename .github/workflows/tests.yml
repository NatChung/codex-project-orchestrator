name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python -m unittest discover -s tools/projects-agent-mcp -v
      - run: uv run python -m unittest discover -s scripts -v
      - run: uv build
